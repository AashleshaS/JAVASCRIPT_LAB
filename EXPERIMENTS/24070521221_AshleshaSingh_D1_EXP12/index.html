<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Event Registration System</title>
    <link rel="stylesheet" href="styles.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>Campus Event Registration System</h1>
    </header>

    <div id="feedback-message"></div>

    <div class="main-content">
        <!-- Event Selection Section -->
        <div class="card">
            <h2>Available Events</h2>
            <div id="loader">Loading events via AJAX...</div>
            <div id="event-list"></div>
        </div>

        <!-- Registration Form Section -->
        <div class="card">
            <h2>Registration Form</h2>
            <form id="registration-form">
                <div class="form-group">
                    <label for="event-select">Selected Event</label>
                    <select id="event-select" required>
                        <option value="">-- Choose an Event --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="student-name">Full Name</label>
                    <input type="text" id="student-name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="student-prn">PRN (Student ID)</label>
                    <input type="text" id="student-prn" placeholder="e.g. 2026101" required>
                </div>

                <div class="form-group">
                    <label for="student-email">Email Address</label>
                    <input type="email" id="student-email" placeholder="john@campus.edu" required>
                </div>

                <button type="submit" id="submit-btn">Register Online</button>
            </form>
        </div>
    </div>

    <!-- Registered Students List -->
    <div class="card">
        <h2>Registered Students Records</h2>
        <table>
            <thead>
                <tr>
                    <th>PRN</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Event</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="registrations-table-body">
                <tr><td colspan="5" style="text-align:center;">No registrations found.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
